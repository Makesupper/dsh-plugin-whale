<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 深度求索鲸鱼娘舞台预览</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #0a2540 0%, #030712 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .stage-wrapper {
      position: relative;
      width: 280px;
      height: 220px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 0 24px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(12px);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .stage-wrapper:active {
      transform: scale(0.96);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 380px;
    }
    button {
      background: rgba(30, 58, 138, 0.6);
      border: 1px solid #38bdf8;
      color: #bae6fd;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    .tip {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="margin: 0; color: #38bdf8; text-shadow: 0 0 12px rgba(56,189,248,0.6);">3D DeepSeek Whale Girl</h2>
    <div id="whale-stage" class="stage-wrapper" title="点击敲击木鱼并激发水波"></div>
    <div class="controls">
      <button id="btn-knock">敲击木鱼 (波纹+点头)</button>
      <button id="btn-speak">切换说话口型状态</button>
      <button id="btn-syllable">触发发音音节</button>
    </div>
    <div class="tip">移动鼠标至舞台内：鲸鱼娘目光追踪；点击舞台：敲击伴奏</div>
  </div>

  <script>
    (function() {
      /**
 * Procedural 3D DeepSeek Whale Girl Stage (Zero-Dependency 3D Projection + GLTF Extension Hook)
 *
 * Features:
 * - True 3D perspective projection, rotational matrix transforms, and normal-based shading on <canvas>.
 * - Renders a stylized 3D DeepSeek Blue Whale Girl character:
 *   - 3D lathed/ellipsoid whale hood & chibi head with dynamic yaw/pitch/roll
 *   - Twin floating whale-fin hair tails & dorsal fin
 *   - Animated 3D blinking eyes, rosy cheeks, and lip-synced mouth openness when speaking LLM text
 *   - 3D companion mini wooden fish floating beside her that pulses on each accompaniment knock
 *   - 3D expanding ocean sonar rings & rising bubble particles on knock/speech
 * - External 3D Model Hook: supports `loadExternalModel(url)` and `window` CustomEvent('dsh-whale:load-model')
 *   so users can drop in a `.glb/.gltf` or `<model-viewer>` URL at any time.
 */
class WhaleStage3D {
          container                     = null
          canvas                           = null
          externalSlot                     = null
          rafId                = null
          startTime         = Date.now()
          speaking          = false
          mouthLevel         = 0
          targetMouthLevel         = 0
          knockBounce         = 0
          lookYaw         = 0
          lookPitch         = 0
          modelUrl         = ''
          ripples               = []
          bubbles                   = []
          customEventHandler                              = null

  constructor(options                      = {}) {
    if (options.modelUrl) {
      this.modelUrl = options.modelUrl
    }
    for (let i = 0; i < 10; i++) {
      this.bubbles.push({
        x: (Math.random() - 0.5) * 1.8,
        y: (Math.random() - 0.5) * 1.4,
        z: (Math.random() - 0.5) * 1.2,
        r: 1.5 + Math.random() * 2.5,
        speed: 0.008 + Math.random() * 0.012,
        wobbleOffset: Math.random() * Math.PI * 2
      })
    }
  }

         mount(container             )       {
    this.container = container
    const canvas = document.createElement('canvas')
    canvas.className = 'dsh-whale-3d-canvas'
    canvas.width = 240
    canvas.height = 180
    canvas.style.cssText = 'width: 100%; height: 100%; display: block; pointer-events: none;'
    container.appendChild(canvas)
    this.canvas = canvas

    const extSlot = document.createElement('div')
    extSlot.className = 'dsh-whale-external-model-slot'
    extSlot.style.cssText = 'position: absolute; inset: 0; pointer-events: none; display: none; align-items: center; justify-content: center;'
    container.appendChild(extSlot)
    this.externalSlot = extSlot

    if (this.modelUrl) {
      this.loadExternalModel(this.modelUrl)
    }

    if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
      this.customEventHandler = (e       ) => {
        const detail = (e               )?.detail
        if (detail && typeof detail.url === 'string') {
          this.loadExternalModel(detail.url)
        }
      }
      window.addEventListener('dsh-whale:load-model', this.customEventHandler)
    }

    this.startLoop()
  }

         setPointerLook(normX        , normY        )       {
    this.lookYaw = Math.max(-0.45, Math.min(0.45, normX * 0.4))
    this.lookPitch = Math.max(-0.35, Math.min(0.35, normY * 0.3))
  }

         setSpeaking(active         , level         = 0.65)       {
    this.speaking = active
    this.targetMouthLevel = active ? Math.max(0.2, Math.min(1.0, level)) : 0
    if (active && this.ripples.length < 4) {
      this.ripples.push({
        radius: 0.35,
        maxRadius: 1.35,
        alpha: 0.72,
        color: 'rgba(104, 210, 255, '
      })
    }
  }

         pulseSpeechSyllable()       {
    if (!this.speaking) return
    this.targetMouthLevel = 0.45 + Math.random() * 0.55
  }

         triggerKnockWave()       {
    this.knockBounce = 1.0
    this.ripples.push({
      radius: 0.25,
      maxRadius: 1.55,
      alpha: 0.9,
      color: 'rgba(125, 226, 255, '
    })
  }

  /**
   * Load an external .glb / .gltf 3D model if provided. If modelUrl is empty, reverts to procedural 3D whale girl.
   */
         loadExternalModel(url        )       {
    this.modelUrl = (url || '').trim()
    if (!this.externalSlot || !this.canvas) return
    this.externalSlot.replaceChildren()

    if (!this.modelUrl) {
      this.externalSlot.style.display = 'none'
      this.canvas.style.opacity = '1'
      return
    }

    this.externalSlot.dataset.modelUrl = this.modelUrl
    // If <model-viewer> or custom Three.js loader is present in host page, mount it seamlessly
    if (typeof customElements !== 'undefined' && customElements.get?.('model-viewer')) {
      const viewer = document.createElement('model-viewer')
      viewer.setAttribute('src', this.modelUrl)
      viewer.setAttribute('autoplay', 'true')
      viewer.setAttribute('camera-controls', 'false')
      viewer.setAttribute('interaction-prompt', 'none')
      viewer.style.cssText = 'width: 100%; height: 100%; background: transparent;'
      this.externalSlot.appendChild(viewer)
      this.externalSlot.style.display = 'flex'
      this.canvas.style.opacity = '0.18'
    } else {
      // Keep procedural 3D stage visible and attach metadata badge so external GLTF loader scripts can hook in
      this.externalSlot.style.display = 'none'
      this.canvas.style.opacity = '1'
    }
  }

         getModelUrl()         {
    return this.modelUrl
  }

          rotate3D(p      , pitch        , yaw        , roll        )       {
    // Rotate around Y (yaw)
    const cosY = Math.cos(yaw)
    const sinY = Math.sin(yaw)
    const x1 = p.x * cosY + p.z * sinY
    const z1 = -p.x * sinY + p.z * cosY

    // Rotate around X (pitch)
    const cosX = Math.cos(pitch)
    const sinX = Math.sin(pitch)
    const y2 = p.y * cosX - z1 * sinX
    const z2 = p.y * sinX + z1 * cosX

    // Rotate around Z (roll)
    const cosZ = Math.cos(roll)
    const sinZ = Math.sin(roll)
    const x3 = x1 * cosZ - y2 * sinZ
    const y3 = x1 * sinZ + y2 * cosZ

    return { x: x3, y: y3, z: z2 }
  }

          project(p      , width        , height        )                 {
    const fov = 3.2
    const cameraZ = 3.6
    const depth = Math.max(0.5, cameraZ - p.z)
    const scale = fov / depth
    const halfMin = Math.min(width, height) * 0.46
    return {
      x: width * 0.5 + p.x * scale * halfMin,
      y: height * 0.52 - p.y * scale * halfMin,
      z: p.z,
      scale
    }
  }

          renderFrame()       {
    if (!this.canvas) return
    const ctx = typeof this.canvas.getContext === 'function' ? this.canvas.getContext('2d') : null
    if (!ctx) return

    const w = this.canvas.width || 240
    const h = this.canvas.height || 180
    ctx.clearRect(0, 0, w, h)

    const elapsed = (Date.now() - this.startTime) * 0.001
    const breathY = Math.sin(elapsed * 2.4) * 0.038
    const idleYaw = Math.sin(elapsed * 1.25) * 0.14 + this.lookYaw
    const idlePitch = Math.cos(elapsed * 1.6) * 0.05 + this.lookPitch
    const idleRoll = Math.sin(elapsed * 1.05) * 0.032

    if (this.knockBounce > 0.001) {
      this.knockBounce *= 0.84
    } else {
      this.knockBounce = 0
    }

    if (this.speaking) {
      const wave = 0.35 + 0.65 * Math.abs(Math.sin(elapsed * 11.5))
      this.mouthLevel += (this.targetMouthLevel * wave - this.mouthLevel) * 0.35
    } else {
      this.mouthLevel *= 0.78
    }

    const bounceScale = 1 + this.knockBounce * 0.09
    const centerY = 0.12 + breathY + this.knockBounce * 0.065

    // 1. Render 3D Horizontal Sonar Ripples beneath the Whale Girl
    for (let i = this.ripples.length - 1; i >= 0; i--) {
      const r = this.ripples[i]
      r.radius += 0.028
      r.alpha *= 0.93
      if (r.alpha <= 0.03 || r.radius >= r.maxRadius) {
        this.ripples.splice(i, 1)
        continue
      }
      const ringCenter = this.project({ x: 0, y: -0.78, z: 0 }, w, h)
      ctx.save()
      ctx.beginPath()
      ctx.ellipse(
        ringCenter.x,
        ringCenter.y,
        r.radius * 58 * ringCenter.scale,
        r.radius * 19 * ringCenter.scale,
        0,
        0,
        Math.PI * 2
      )
      ctx.strokeStyle = `${r.color}${r.alpha.toFixed(3)})`
      ctx.lineWidth = 2.0
      ctx.stroke()
      ctx.restore()
    }

    // 2. Render Rising 3D Deep-Sea Bubbles
    for (const b of this.bubbles) {
      b.y += b.speed
      if (b.y > 0.95) {
        b.y = -0.85
      }
      const bx = b.x + Math.sin(elapsed * 2 + b.wobbleOffset) * 0.06
      const pt = this.project({ x: bx, y: b.y, z: b.z }, w, h)
      ctx.save()
      ctx.beginPath()
      ctx.arc(pt.x, pt.y, Math.max(1, b.r * pt.scale), 0, Math.PI * 2)
      ctx.fillStyle = 'rgba(148, 224, 255, 0.32)'
      ctx.fill()
      ctx.restore()
    }

    // 3. Voluminous Wavy Gradient Back Hair Mass (Navy top -> Cobalt mid -> Sky-Blue curled tips)
    const backHairAnchor = this.rotate3D(
      { x: 0, y: centerY - 0.16, z: -0.22 },
      idlePitch * 0.75,
      idleYaw * 0.75,
      idleRoll * 0.75
    )
    const bhp = this.project(backHairAnchor, w, h)
    const bhScale = bhp.scale * bounceScale
    const hairSway = Math.sin(elapsed * 2.2) * 2.8 * bhScale

    ctx.save()
    ctx.translate(bhp.x, bhp.y)
    ctx.rotate(idleRoll * 0.65)

    const backHairGrad = ctx.createLinearGradient(0, -34 * bhScale, 0, 56 * bhScale)
    backHairGrad.addColorStop(0, '#1E3A8A')
    backHairGrad.addColorStop(0.45, '#2563EB')
    backHairGrad.addColorStop(0.78, '#3B82F6')
    backHairGrad.addColorStop(1, '#7DD3FC')
    ctx.fillStyle = backHairGrad

    // Main voluminous back hair silhouette with outward curled waves at bottom
    ctx.beginPath()
    ctx.moveTo(-36 * bhScale, -22 * bhScale)
    ctx.quadraticCurveTo(-52 * bhScale, 2 * bhScale, -48 * bhScale + hairSway * 0.6, 26 * bhScale)
    ctx.quadraticCurveTo(-56 * bhScale + hairSway, 42 * bhScale, -42 * bhScale + hairSway, 50 * bhScale)
    ctx.quadraticCurveTo(-34 * bhScale + hairSway, 52 * bhScale, -32 * bhScale + hairSway, 43 * bhScale)
    ctx.quadraticCurveTo(-28 * bhScale + hairSway, 55 * bhScale, -16 * bhScale + hairSway, 54 * bhScale)
    ctx.quadraticCurveTo(-6 * bhScale + hairSway, 48 * bhScale, 0 + hairSway, 55 * bhScale)
    ctx.quadraticCurveTo(10 * bhScale + hairSway, 50 * bhScale, 18 * bhScale + hairSway, 54 * bhScale)
    ctx.quadraticCurveTo(30 * bhScale + hairSway, 55 * bhScale, 33 * bhScale + hairSway, 43 * bhScale)
    ctx.quadraticCurveTo(36 * bhScale + hairSway, 52 * bhScale, 44 * bhScale + hairSway, 50 * bhScale)
    ctx.quadraticCurveTo(56 * bhScale + hairSway, 42 * bhScale, 48 * bhScale + hairSway * 0.6, 26 * bhScale)
    ctx.quadraticCurveTo(52 * bhScale, 2 * bhScale, 36 * bhScale, -22 * bhScale)
    ctx.closePath()
    ctx.fill()
    ctx.strokeStyle = '#172554'
    ctx.lineWidth = 1.3 * bhScale
    ctx.stroke()

    // Outer fairy-like thin curled hair strands on both sides (matching reference silhouette)
    for (const dir of [-1, 1]) {
      ctx.strokeStyle = '#2563EB'
      ctx.lineWidth = 1.6 * bhScale
      ctx.beginPath()
      ctx.moveTo(dir * 40 * bhScale, -10 * bhScale)
      ctx.quadraticCurveTo(
        dir * 58 * bhScale + hairSway * 0.5,
        12 * bhScale,
        dir * 50 * bhScale + hairSway,
        34 * bhScale
      )
      ctx.quadraticCurveTo(
        dir * 45 * bhScale + hairSway,
        44 * bhScale,
        dir * 53 * bhScale + hairSway,
        46 * bhScale
      )
      ctx.stroke()
    }
    ctx.restore()

    // 4. 3D Upturned Fluked Whale Tail (emerging from lower right back, navy-to-sky-blue with fin rays)
    const tailSwing = Math.sin(elapsed * (this.speaking ? 6.5 : 3.2)) * 0.24
    const tailRoot = this.rotate3D(
      { x: 0.32, y: centerY - 0.55, z: -0.15 },
      idlePitch * 0.6,
      idleYaw + tailSwing * 0.8,
      idleRoll * 0.5
    )
    const tailProj = this.project(tailRoot, w, h)
    const ts = tailProj.scale * bounceScale
    ctx.save()
    ctx.translate(tailProj.x, tailProj.y)
    ctx.rotate(tailSwing * 0.45 - 0.08)
    const tailGrad = ctx.createLinearGradient(0, 8 * ts, 28 * ts, -18 * ts)
    tailGrad.addColorStop(0, '#172554')
    tailGrad.addColorStop(0.55, '#2563EB')
    tailGrad.addColorStop(1, '#7DD3FC')
    ctx.fillStyle = tailGrad
    ctx.beginPath()
    // Tail peduncle base curving up into two graceful whale flukes
    ctx.moveTo(-4 * ts, 6 * ts)
    ctx.quadraticCurveTo(8 * ts, 2 * ts, 10 * ts, -10 * ts)
    // Upper-left fluke lobe
    ctx.quadraticCurveTo(8 * ts, -22 * ts, 15 * ts, -26 * ts)
    ctx.quadraticCurveTo(22 * ts, -21 * ts, 21 * ts, -10 * ts)
    // Right fluke lobe
    ctx.quadraticCurveTo(30 * ts, -14 * ts, 35 * ts, -6 * ts)
    ctx.quadraticCurveTo(29 * ts, 6 * ts, 14 * ts, 8 * ts)
    ctx.quadraticCurveTo(5 * ts, 11 * ts, -4 * ts, 6 * ts)
    ctx.closePath()
    ctx.fill()
    ctx.strokeStyle = '#0F172A'
    ctx.lineWidth = 1.2 * ts
    ctx.stroke()
    // Subtle fluke rib lines
    ctx.strokeStyle = 'rgba(186, 230, 253, 0.55)'
    ctx.lineWidth = 0.9 * ts
    ctx.beginPath()
    ctx.moveTo(10 * ts, 2 * ts)
    ctx.quadraticCurveTo(14 * ts, -12 * ts, 15 * ts, -21 * ts)
    ctx.moveTo(12 * ts, 3 * ts)
    ctx.quadraticCurveTo(22 * ts, -4 * ts, 30 * ts, -6 * ts)
    ctx.stroke()
    ctx.restore()

    // 5. Chibi Legs, White Socks & Navy Mary Jane Shoes (beneath skirt hem)
    const legsRoot = this.rotate3D(
      { x: 0, y: centerY - 0.72, z: 0.06 },
      idlePitch * 0.5,
      idleYaw * 0.6,
      idleRoll * 0.5
    )
    const lp = this.project(legsRoot, w, h)
    const ls = lp.scale * bounceScale
    ctx.save()
    ctx.translate(lp.x, lp.y)
    for (const side of [-1, 1]) {
      const lx = side * 9.2 * ls
      // Upper leg skin
      ctx.fillStyle = '#FFE4D6'
      ctx.beginPath()
      ctx.ellipse(lx, -3 * ls, 4.4 * ls, 6.5 * ls, 0, 0, Math.PI * 2)
      ctx.fill()
      // White ankle sock
      ctx.fillStyle = '#FFFFFF'
      ctx.beginPath()
      ctx.ellipse(lx, 2.5 * ls, 4.7 * ls, 5.5 * ls, 0, 0, Math.PI * 2)
      ctx.fill()
      // Navy Mary Jane rounded shoe
      ctx.fillStyle = '#172554'
      ctx.beginPath()
      ctx.ellipse(lx, 6.2 * ls, 5.4 * ls, 3.8 * ls, 0, 0, Math.PI * 2)
      ctx.fill()
      ctx.strokeStyle = '#0F172A'
      ctx.lineWidth = 1.1 * ls
      ctx.stroke()
      // White strap & tiny gold buckle across shoe vamp
      ctx.strokeStyle = '#F8FAFC'
      ctx.lineWidth = 1.3 * ls
      ctx.beginPath()
      ctx.moveTo(lx - 4.2 * ls, 4.2 * ls)
      ctx.quadraticCurveTo(lx, 5.2 * ls, lx + 4.2 * ls, 4.2 * ls)
      ctx.stroke()
    }
    ctx.restore()

    // 6. Maid Navy Lolita Dress, Gold Vine Embroidery, Double White Ruffled Petticoat & Whale Apron
    const bodyRoot = this.rotate3D(
      { x: 0, y: centerY - 0.43, z: 0.12 },
      idlePitch * 0.68,
      idleYaw * 0.78,
      idleRoll * 0.68
    )
    const bpBody = this.project(bodyRoot, w, h)
    const bs = bpBody.scale * bounceScale
    const dressW = 38 * bs
    const dressH = 34 * bpBody.scale

    ctx.save()
    ctx.translate(bpBody.x, bpBody.y)
    ctx.rotate(idleRoll * 0.55)

    // 6a. Double-layered white pleated lace petticoat under-hem
    ctx.fillStyle = '#F8FAFC'
    for (let i = -7; i <= 7; i++) {
      const px = i * 3.7 * bs
      const py = dressH * 0.56 - Math.abs(i) * 0.45 * bs
      ctx.beginPath()
      ctx.arc(px, py, 3.8 * bs, 0, Math.PI * 2)
      ctx.fill()
    }
    ctx.strokeStyle = '#CBD5E1'
    ctx.lineWidth = 1.0 * bs
    ctx.beginPath()
    ctx.ellipse(0, dressH * 0.53, dressW * 0.76, 5.2 * bs, 0, 0.06 * Math.PI, 0.94 * Math.PI)
    ctx.stroke()
    // Warm beige/gold lace trim line along the petticoat
    ctx.strokeStyle = '#D97706'
    ctx.lineWidth = 0.9 * bs
    ctx.beginPath()
    ctx.ellipse(0, dressH * 0.50, dressW * 0.73, 4.4 * bs, 0, 0.08 * Math.PI, 0.92 * Math.PI)
    ctx.stroke()

    // 6b. Main Navy Lolita Bell Skirt
    const skirtGrad = ctx.createLinearGradient(0, -dressH * 0.42, 0, dressH * 0.52)
    skirtGrad.addColorStop(0, '#172554')
    skirtGrad.addColorStop(0.55, '#1E3A8A')
    skirtGrad.addColorStop(1, '#0F172A')
    ctx.fillStyle = skirtGrad
    ctx.beginPath()
    ctx.moveTo(-dressW * 0.38, -dressH * 0.40)
    ctx.lineTo(dressW * 0.38, -dressH * 0.40)
    ctx.quadraticCurveTo(dressW * 0.68, dressH * 0.08, dressW * 0.78, dressH * 0.42)
    ctx.quadraticCurveTo(0, dressH * 0.56, -dressW * 0.78, dressH * 0.42)
    ctx.quadraticCurveTo(-dressW * 0.68, dressH * 0.08, -dressW * 0.38, -dressH * 0.40)
    ctx.closePath()
    ctx.fill()
    ctx.strokeStyle = '#0F172A'
    ctx.lineWidth = 1.2 * bs
    ctx.stroke()

    // 6c. Gold Vine & Shell Embroidery Band along dark navy skirt border
    ctx.strokeStyle = '#F59E0B'
    ctx.lineWidth = 1.2 * bs
    ctx.beginPath()
    ctx.ellipse(0, dressH * 0.31, dressW * 0.68, 5.2 * bs, 0, 0.08 * Math.PI, 0.92 * Math.PI)
    ctx.stroke()
    ctx.strokeStyle = '#FBBF24'
    ctx.lineWidth = 1.0 * bs
    for (let g = -4; g <= 4; g++) {
      const gx = g * 5.2 * bs
      const gy = dressH * 0.38 - Math.abs(g) * 0.4 * bs
      ctx.beginPath()
      ctx.arc(gx, gy, 1.8 * bs, 0, Math.PI)
      ctx.stroke()
    }
    // Twin dark-navy & gold trim ribbon bows on the skirt hem
    for (const bowSide of [-1, 1]) {
      const bx = bowSide * 14.5 * bs
      const by = dressH * 0.35
      ctx.fillStyle = '#0F172A'
      ctx.strokeStyle = '#F59E0B'
      ctx.lineWidth = 0.9 * bs
      ctx.beginPath()
      ctx.moveTo(bx, by)
      ctx.lineTo(bx - 3.8 * bs, by - 2.4 * bs)
      ctx.lineTo(bx - 3.8 * bs, by + 2.4 * bs)
      ctx.closePath()
      ctx.fill()
      ctx.stroke()
      ctx.beginPath()
      ctx.moveTo(bx, by)
      ctx.lineTo(bx + 3.8 * bs, by - 2.4 * bs)
      ctx.lineTo(bx + 3.8 * bs, by + 2.4 * bs)
      ctx.closePath()
      ctx.fill()
      ctx.stroke()
    }

    // 6e. White Pleated Maid Apron with Ruffled Scallop Border
    ctx.fillStyle = '#FFFFFF'
    for (let a = -6; a <= 6; a++) {
      const angle = (a / 6) * 0.85 * Math.PI
      const rx = Math.sin(angle) * dressW * 0.42
      const ry = dressH * 0.04 + Math.cos(angle) * dressH * 0.30
      ctx.beginPath()
      ctx.arc(rx, ry, 3.0 * bs, 0, Math.PI * 2)
      ctx.fill()
    }

      h
    )
    if (this.speaking || this.knockBounce > 0.15) {
      const spoutHeight = this.speaking ? 12 + Math.sin(elapsed * 14) * 4 : 14 * this.knockBounce
      ctx.strokeStyle = 'rgba(125, 211, 252, 0.85)'
      ctx.lineWidth = 2.2
      ctx.beginPath()
      ctx.moveTo(crownPos.x, crownPos.y - 3)
      ctx.quadraticCurveTo(crownPos.x - 8, crownPos.y - spoutHeight, crownPos.x - 16, crownPos.y - spoutHeight + 4)
      ctx.moveTo(crownPos.x, crownPos.y - 3)
      ctx.quadraticCurveTo(crownPos.x + 8, crownPos.y - spoutHeight, crownPos.x + 16, crownPos.y - spoutHeight + 4)
      ctx.stroke()
    }
    ctx.restore()

    // 8. Floating 3D Brushed Stainless Steel Plate (不锈钢盘) beside the Whale Girl
    const platePulse = 1 + this.knockBounce * 0.32
    const plate3D = this.rotate3D(
      { x: -0.72, y: centerY - 0.26 + this.knockBounce * 0.12, z: 0.28 },
      idlePitch * 0.5,
      idleYaw * 0.5,
      -0.06
    )
    const rp = this.project(plate3D, w, h)
    const ps = rp.scale
    ctx.save()
    ctx.translate(rp.x, rp.y)
    ctx.scale(platePulse, platePulse)

    // 8a. Stainless Steel Plate Under-base Shadow / Bevel Lip
    const baseMetalGrad = ctx.createLinearGradient(-15 * ps, 0, 15 * ps, 6 * ps)
    baseMetalGrad.addColorStop(0, '#475569')
    baseMetalGrad.addColorStop(0.45, '#CBD5E1')
    baseMetalGrad.addColorStop(0.75, '#64748B')
    baseMetalGrad.addColorStop(1, '#334155')
    ctx.fillStyle = baseMetalGrad
    ctx.beginPath()
    ctx.ellipse(0, 2.6 * ps, 14.5 * ps, 5.8 * ps, 0, 0, Math.PI * 2)
    ctx.fill()

    // 8b. Wide Flanged Brushed Stainless Steel Rim (银白金属拉丝宽折边盘沿)
    const rimGrad = ctx.createLinearGradient(-16 * ps, -5 * ps, 16 * ps, 5 * ps)
    rimGrad.addColorStop(0, '#94A3B8')
    rimGrad.addColorStop(0.25, '#F8FAFC')
    rimGrad.addColorStop(0.5, '#CBD5E1')
    rimGrad.addColorStop(0.78, '#FFFFFF')
    rimGrad.addColorStop(1, '#64748B')
    ctx.fillStyle = rimGrad
    ctx.beginPath()
    ctx.ellipse(0, 0, 15.8 * ps, 6.2 * ps, 0, 0, Math.PI * 2)
    ctx.fill()
    ctx.strokeStyle = '#475569'
    ctx.lineWidth = 0.95 * ps
    ctx.stroke()

    // 8c. Recessed Inner Metallic Dish Well (内凹不锈钢盘底反光区)
    const wellGrad = ctx.createLinearGradient(-11 * ps, -3 * ps, 11 * ps, 4 * ps)
    wellGrad.addColorStop(0, '#64748B')
    wellGrad.addColorStop(0.38, '#E2E8F0')
    wellGrad.addColorStop(0.7, '#94A3B8')
    wellGrad.addColorStop(1, '#F1F5F9')
    ctx.fillStyle = wellGrad
    ctx.beginPath()
    ctx.ellipse(0, 0.4 * ps, 11.4 * ps, 4.1 * ps, 0, 0, Math.PI * 2)
    ctx.fill()
    ctx.strokeStyle = '#64748B'
    ctx.lineWidth = 0.8 * ps
    ctx.stroke()

    // 8d. Specular Metallic Sheen Streak across the stainless steel plate
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)'
    ctx.lineWidth = 1.2 * ps
    ctx.beginPath()
    ctx.moveTo(-8.5 * ps, -2.0 * ps)
    ctx.lineTo(-2.5 * ps, 1.8 * ps)
    ctx.moveTo(3.0 * ps, -1.8 * ps)
    ctx.lineTo(8.0 * ps, 1.4 * ps)
    ctx.stroke()
    ctx.restore()
  }

          startLoop()       {
    if (this.rafId !== null) return
    const raf =
      typeof window !== 'undefined' && typeof window.requestAnimationFrame === 'function'
        ? window.requestAnimationFrame.bind(window)
        : (cb                      ) => setTimeout(() => cb(Date.now()), 33)                     

    const step = () => {
      this.renderFrame()
      if (this.canvas) {
        this.rafId = raf(step)
      }
    }
    this.rafId = raf(step)
  }

         dispose()       {
    if (this.rafId !== null) {
      if (typeof window !== 'undefined' && typeof window.cancelAnimationFrame === 'function') {
        window.cancelAnimationFrame(this.rafId)
      } else {
        clearTimeout(this.rafId                                            )
      }
      this.rafId = null
    }
    if (typeof window !== 'undefined' && this.customEventHandler && typeof window.removeEventListener === 'function') {
      window.removeEventListener('dsh-whale:load-model', this.customEventHandler)
      this.customEventHandler = null
    }
    if (this.externalSlot) {
      this.externalSlot.remove()
      this.externalSlot = null
    }
    if (this.canvas) {
      this.canvas.remove()
      this.canvas = null
    }
    this.container = null
  }
}

      const stageEl = document.getElementById('whale-stage');
      const stage3D = new WhaleStage3D();
      stage3D.mount(stageEl);

      stageEl.addEventListener('mousemove', (e) => {
        const rect = stageEl.getBoundingClientRect();
        const normX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
        const normY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
        stage3D.setPointerLook(normX, -normY);
      });
      stageEl.addEventListener('mouseleave', () => {
        stage3D.setPointerLook(0, 0);
      });

      function doKnock() {
        stage3D.triggerKnockWave();
      }
      stageEl.addEventListener('click', doKnock);
      document.getElementById('btn-knock').addEventListener('click', doKnock);

      let isSpeaking = false;
      const btnSpeak = document.getElementById('btn-speak');
      btnSpeak.addEventListener('click', () => {
        isSpeaking = !isSpeaking;
        stage3D.setSpeaking(isSpeaking, 0.75);
        btnSpeak.textContent = isSpeaking ? '停止说话' : '切换说话口型状态';
      });

      document.getElementById('btn-syllable').addEventListener('click', () => {
        if (!isSpeaking) {
          isSpeaking = true;
          stage3D.setSpeaking(true, 0.75);
          btnSpeak.textContent = '停止说话';
        }
        stage3D.pulseSpeechSyllable();
      });
    })();
  </script>
